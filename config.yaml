model:
  name: gemma2:2b
  temperature: 0.7
  timeout_seconds: 120
  json_mode: true
  max_retries: 1

paths:
  data_raw: data/raw
  data_processed: data/processed
  output_dir: output
  assets_dir: assets
  fonts_dir: assets/fonts

hunt:
  default_item_count: 12
  min_items: 6
  max_items: 20

languages:
  - hi
  - en

logging:
  level: INFO
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"